<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Resumidor de Texto</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/icons/sticky.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-width: 100vw;
            background: #2d3a4a;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 600px;
            width: 100%;
        }

        .form-group h5 {
            color: #232526;
            font-weight: 700;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #bdbdbd;
            margin-bottom: 1rem;
        }

        .btn-info {
            background: linear-gradient(90deg, #36d1c4 0%, #5b86e5 100%);
            border: none;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(91, 134, 229, 0.15);
        }

        .btn-info:hover {
            background: linear-gradient(90deg, #5b86e5 0%, #36d1c4 100%);
        }

        .icono-titulo {
            font-size: 2.5rem;
            color: #36d1c4;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="text-center">
            <i class="bi bi-pen-fill icono-titulo"></i>
            <h2 class="mb-4">Resumidor de Texto</h2>
        </div>
        <form method="POST" action="/resumir">
            <div class="form-group">
                <div class="mb-3">
                    <label for="modelo" class="form-label"><strong>Selecciona el modelo de IA:</strong></label>
                    <div class="d-flex gap-3 justify-content-center">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="modelo" id="modelo_gemini" value="gemini"
                                checked>
                            <label class="form-check-label" for="modelo_gemini"><i class="bi bi-gem"></i> Gemini</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="modelo" id="modelo_openai" value="openai">
                            <label class="form-check-label" for="modelo_openai"><i class="bi bi-robot"></i> OpenAI</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="modelo" id="modelo_deepseek" value="deepseek">
                            <label class="form-check-label" for="modelo_deepseek"><i class="bi bi-lightning"></i> DeepSeek
                            </label>
                        </div>
                    </div>
                </div>
                <h5>Título <i class="bi bi-card-heading"></i></h5>
                <textarea type="text" rows="2" class="form-control" name="titulo" required placeholder="Introduce el título">
                </textarea>
                <h5>Descripción de la incidencia <i class="bi bi-chat-left-text"></i></h5>
                <textarea type="text" rows="5" class="form-control" name="descripcion" required
                    placeholder="Introduce la descripción de la incidencia"></textarea>
                <h5>Comentarios de ejecución <i class="bi bi-pencil-square"></i></h5>
                <textarea type="text" rows="5" class="form-control" name="comentarios" required
                    placeholder="Introduce los comentarios de ejecución"></textarea>
                <br />
                <button type="submit" class="btn btn-info w-100"><i class="bi bi-lightning-charge"></i> Resumir</button>
            </div>
        </form>
    </div>
</body>

</html>
