<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Error</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/icons/sticky.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-width: 100vw;
            background: #2d3a4a;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 600px;
            width: 100%;
        }

        .icono-titulo {
            font-size: 2.5rem;
            color: #e74c3c;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <i class="bi bi-exclamation-triangle icono-titulo"></i>
        <h2 class="mb-4">Error</h2>
        <div class="alert alert-danger" role="alert">
            <p class="alert-heading"><i class="bi bi-x-circle"></i> Ha ocurrido un error</p>
            <p>{{ error_message }}</p>
        </div>
        <a href="/" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
</body>

</html>
