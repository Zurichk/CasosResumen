{% extends 'base.html' %}

{% block content %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Subir JSON</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/icons/sticky.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html, body { height: 100%; }
        body {
            min-height: 100vh;
            min-width: 100vw;
            background: #2d3a4a;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 600px;
            width: 100%;
        }
        .icono-titulo {
            font-size: 2.5rem;
            color: #5b86e5;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <i class="bi bi-upload icono-titulo"></i>
        <h2 class="mb-4">Sube un fichero .json</h2>
        <form action="{{ url_for('upload_file') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <input type="file" name="filejson" class="form-control mb-3" />
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-cloud-arrow-up"></i> Subir y predecir</button>
            </div>
        </form>
        <a href="/" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
</body>
</html>
{% endblock %}
